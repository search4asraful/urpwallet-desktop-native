name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # WINDOWS: Build Native .msi Installer
  build-windows:
    name: Windows Installer (.msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Build MSI Installer
        run: cargo wix --nocapture

      - name: Upload Windows MSI to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/wix/*.msi

  # LINUX: Build Native .deb and .AppImage
  build-linux:
    name: Linux Packages (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Build Debian package (.deb)
        run: |
          curl -sL https://github.com/kornelski/cargo-deb/releases/download/v3.8.0/cargo-deb_3.8.0-1_amd64.deb -o /tmp/cargo-deb.deb
          sudo dpkg -i /tmp/cargo-deb.deb
          cargo deb --no-build

      - name: Build AppImage (.AppImage)
        run: |
          mkdir -p target/AppDir/usr/bin target/AppDir/usr/share/applications target/AppDir/usr/share/icons/hicolor/scalable/apps target/AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/urpwallet target/AppDir/usr/bin/urpwallet
          cp urpwallet.desktop target/AppDir/urpwallet.desktop
          cp urpwallet.desktop target/AppDir/usr/share/applications/urpwallet.desktop
          cp assets/icon.svg target/AppDir/usr/share/icons/hicolor/scalable/apps/urpwallet.svg
          cp assets/icon-256.png target/AppDir/usr/share/icons/hicolor/256x256/apps/urpwallet.png
          cp assets/icon-256.png target/AppDir/urpwallet.png
          ln -sf urpwallet.png target/AppDir/.DirIcon

          cat << 'EOF' > target/AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/urpwallet" "$@"
          EOF
          chmod +x target/AppDir/AppRun

          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run target/AppDir target/urpwallet-x86_64.AppImage

      - name: Upload Linux Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/urpwallet-x86_64.AppImage

  # MACOS: Build .dmg and Apple Binaries
  build-macos:
    name: macOS (.dmg & Apple Binaries)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build Apple Silicon and Intel binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

          tar -cJf urpwallet-aarch64-apple-darwin.tar.xz -C target/aarch64-apple-darwin/release urpwallet
          tar -cJf urpwallet-x86_64-apple-darwin.tar.xz -C target/x86_64-apple-darwin/release urpwallet

      - name: Build macOS DMG
        run: |
          APP_DIR="target/urpwallet.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp target/aarch64-apple-darwin/release/urpwallet "$APP_DIR/Contents/MacOS/urpwallet"
          cp assets/icon.icns "$APP_DIR/Contents/Resources/urpwallet.icns"

          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$CLEAN_VERSION" ]; then CLEAN_VERSION="0.1.3"; fi

          cat << EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>urpwallet</string>
              <key>CFBundleIconFile</key>
              <string>urpwallet.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.urpwallet.desktop</string>
              <key>CFBundleName</key>
              <string>urpwallet</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${CLEAN_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          brew install create-dmg || true
          create-dmg \
            --volname "urpwallet Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "urpwallet.app" 175 190 \
            --app-drop-link 425 190 \
            urpwallet-macOS.dmg \
            "$APP_DIR" || (hdiutil create -volname "urpwallet" -srcfolder "$APP_DIR" -ov -format UDZO urpwallet-macOS.dmg)

      - name: Upload macOS Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            urpwallet-macOS.dmg
            urpwallet-aarch64-apple-darwin.tar.xz
            urpwallet-x86_64-apple-darwin.tar.xz

  # CHECKSUM: Single Consolidated sha256.sum
  checksum:
    name: Generate Checksum
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files
          cd release-files
          # Give GitHub a few seconds to process assets
          sleep 10
          
          # Explicitly pass owner/repo and tag to avoid git ambiguity
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*"
            
          rm -f sha256.sum
          sha256sum * > ../sha256.sum
          echo "=== Final Release Checksums ==="
          cat ../sha256.sum

      - name: Upload sha256.sum to Release
        uses: softprops/action-gh-release@v2
        with:
          files: sha256.sum
